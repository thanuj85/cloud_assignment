apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: app
  labels:
    app: parser
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: parser
  template:
    metadata:
      labels:
        app: parser
    spec:
      containers:
        - name: parser
          image: thanuj85/command-parser:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_URI
              valueFrom:
                configMapKeyRef: { name: parser-config, key: MODEL_URI }
            - name: MODEL_VERSION
              valueFrom:
                configMapKeyRef: { name: parser-config, key: MODEL_VERSION }
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: parser-config, key: S3_ENDPOINT }
            - name: MAX_NEW_TOKENS
              valueFrom:
                configMapKeyRef: { name: parser-config, key: MAX_NEW_TOKENS }
            - name: FAULT_INJECT
              valueFrom:
                configMapKeyRef: { name: parser-config, key: FAULT_INJECT }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: s3-credentials, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: s3-credentials, key: AWS_SECRET_ACCESS_KEY }
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: parser
  namespace: app
spec:
  selector:
    app: parser
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parser
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: parser.localhost
      http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: parser
                port:
                  number: 8000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: parser
                port:
                  number: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: parser-config
  namespace: app
data:
  MODEL_URI: s3://models/v1
  MODEL_VERSION: v1
  S3_ENDPOINT: http://seaweedfs.data.svc.cluster.local:8333
  MAX_NEW_TOKENS: "64"
  FAULT_INJECT: "0"
